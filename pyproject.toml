[project]
name = "transcript-combobulator"
version = "0.4.1"
description = "Pre-processes audio files for better Whisper transcription"
readme = "docs/README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
    { name = "Sean Kennedy", email = "sean@codeserious.com" }
]
# torch and torchaudio are an exact pair (torchaudio's wheel declares no
# dependencies, so pip will not enforce it). torchaudio 2.11.0 is its final
# maintenance line, which caps torch. Nothing here calls torchaudio I/O, so
# torchcodec (ABI-locked to torch, no aarch64 wheel before 0.11) is not needed.
dependencies = [
    "openai-whisper==20250625",
    "python-dotenv==1.2.3",
    "soundfile==0.14.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "silero-vad==6.2.1",
    # silero-vad does not declare onnxruntime; VAD_BACKEND=onnx (default) needs it.
    # 1.23.2 is the last release with cp310 wheels; 1.24+ requires Python 3.11.
    "onnxruntime==1.23.2",
    "rich==15.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
]
# Apple Silicon only; inert until a WHISPER_RUNTIME seam exists.
mac = [
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/seriouslysean/transcript-combobulator"
Repository = "https://github.com/seriouslysean/transcript-combobulator.git"
Issues = "https://github.com/seriouslysean/transcript-combobulator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
pythonpath = ["."]
markers = [
    "slow: real whisper or VAD inference; needs models/ and minutes of CPU",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
# whisper, silero_vad, torchaudio, and soundfile ship no type information.
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3
